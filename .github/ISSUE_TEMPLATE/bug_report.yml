name: Bug Report
description: Report a bug or discrepancy against the agnara==0.1.0a2 baseline
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report. Please ensure the issue is reproducible with `agnara==0.1.0a2` on CPython >=3.14.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `python app.py`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen within the 0.1.0a2 dependency-injection model.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating System, CPython version (e.g. CPython 3.14.4 on Windows 11).
    validations:
      required: true
