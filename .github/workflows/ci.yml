name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install agnara==0.1.0a2 pytest>=9.0.0 ruff>=0.16.0

      - name: Check code formatting (ruff format)
        run: |
          ruff format --check .

      - name: Lint codebase (ruff check)
        run: |
          ruff check .

      - name: Run test suite (pytest)
        run: |
          pytest tests/ -v

      - name: Execute DI smoke scenario
        run: |
          python app.py
